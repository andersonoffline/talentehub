<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="vendor/gsap.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0A0A0A;
      font-family: Georgia, 'Times New Roman', serif;
    }

    /* ── Composition root ── */
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0A0A0A;
    }

    /* ── Canvas ── */
    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      z-index: 0;
      display: block;
    }

    /* ── All scene clips ── */
    .scene-clip {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* ─── SCENE 1 ─── */
    #s1 { z-index: 2; }

    #s1-glow {
      position: absolute;
      width: 680px; height: 680px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,162,75,0.3) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #s1-dot {
      position: absolute;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #C9A24B;
      box-shadow: 0 0 30px 10px rgba(201,162,75,0.9),
                  0 0 100px 40px rgba(201,162,75,0.4);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #s1-text {
      position: absolute;
      z-index: 3;
      text-align: center;
      color: #F5F0E8;
      font-size: 52px;
      letter-spacing: 2px;
      line-height: 1.65;
      text-shadow: 0 0 24px rgba(201,162,75,0.45);
      padding: 0 108px;
      top: 54%;
      width: 100%;
    }

    /* ─── SCENE 2 ─── */
    #s2 { z-index: 3; }

    #s2-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg,
        transparent 0%, rgba(201,162,75,0.14) 50%, transparent 100%);
      z-index: 0;
    }
    #s2-block {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 108px;
    }
    #s2-main {
      color: #F5F0E8;
      font-size: 62px;
      line-height: 1.55;
      letter-spacing: 1px;
    }
    #s2-uline-wrap {
      display: block;
      margin-top: 20px;
      width: 100%;
      overflow: visible;
    }
    #s2-uline {
      stroke: #C9A24B;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 864;
      stroke-dashoffset: 864;
    }

    /* ─── SCENE 3 ─── */
    #s3 { z-index: 4; }

    .kw-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kw-text {
      color: #F5F0E8;
      font-size: 130px;
      letter-spacing: 14px;
      text-shadow: 0 0 50px rgba(201,162,75,0.6),
                   0 0 100px rgba(201,162,75,0.25);
    }
    .spark {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #C9A24B;
      box-shadow: 0 0 10px 4px rgba(201,162,75,0.8);
    }

    /* ─── SCENE 4 ─── */
    #s4 { z-index: 5; }

    #s4-inner {
      text-align: center;
      padding: 0 108px;
    }
    .s4-ln {
      display: block;
      color: #F5F0E8;
      font-size: 58px;
      font-style: italic;
      line-height: 1.7;
      letter-spacing: 0.5px;
    }
    #s4-divider {
      width: 2px;
      background: rgba(201,162,75,0.5);
      margin: 28px auto;
      height: 52px;
    }
    #s4-ref {
      display: block;
      color: #C9A24B;
      font-size: 34px;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-style: normal;
    }

    /* ─── SCENE 5 ─── */
    #s5 { z-index: 6; }

    #s5-rays-bg {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 55% at 50% 50%,
        rgba(201,162,75,0.35) 0%,
        rgba(201,162,75,0.1) 38%,
        transparent 68%);
    }
    .ray-line {
      position: absolute;
      top: 50%; left: 50%;
      width: 2px;
      background: linear-gradient(to bottom,
        rgba(201,162,75,0.7) 0%, transparent 100%);
      transform-origin: top center;
    }
    #s5-wrap {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 0 80px;
    }
    #s5-eyebrow {
      display: block;
      color: rgba(201,162,75,0.8);
      font-size: 50px;
      letter-spacing: 12px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #s5-t1, #s5-t2 {
      display: block;
      color: #C9A24B;
      font-size: 178px;
      letter-spacing: 8px;
      text-transform: uppercase;
      line-height: 0.92;
      text-shadow:
        0 0 40px rgba(201,162,75,0.8),
        0 0 100px rgba(201,162,75,0.3),
        0 4px 10px rgba(0,0,0,0.95);
    }

    /* ─── SCENE 6 ─── */
    #s6 { z-index: 7; }

    #s6-wrap {
      text-align: center;
    }
    #s6-title {
      display: block;
      color: #C9A24B;
      font-size: 96px;
      letter-spacing: 5px;
      text-transform: uppercase;
      line-height: 1.1;
      text-shadow: 0 0 25px rgba(201,162,75,0.45);
    }
    #s6-sub {
      display: block;
      color: #a08a5a;
      font-size: 30px;
      letter-spacing: 3px;
      margin-top: 24px;
    }
    #s6-dot {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #C9A24B;
      box-shadow: 0 0 18px 7px rgba(201,162,75,0.65);
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ─── FADE OVERLAY ─── */
    #final-fade {
      position: absolute;
      inset: 0;
      background: #0A0A0A;
      z-index: 98;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div
  id="root"
  data-composition-id="main"
  data-start="0"
  data-duration="30"
  data-width="1080"
  data-height="1920"
>

  <!-- ── Particle canvas (track 0, full 30s) ── -->
  <canvas
    id="particle-canvas"
    class="clip"
    data-start="0"
    data-duration="30"
    data-track-index="0"
    width="1080"
    height="1920"
  ></canvas>

  <!-- ── Scene 1: Abertura (0–5s) track 1 ── -->
  <div id="s1" class="clip scene-clip"
       data-start="0" data-duration="5" data-track-index="1">
    <div id="s1-glow"></div>
    <div id="s1-dot"></div>
    <p id="s1-text">Há mais de dois mil anos…</p>
  </div>

  <!-- ── Scene 2: Revelação (4–9s) track 2 ── -->
  <div id="s2" class="clip scene-clip"
       data-start="4" data-duration="5" data-track-index="2">
    <div id="s2-sweep"></div>
    <div id="s2-block">
      <p id="s2-main">uma história mudou<br>o mundo para sempre.</p>
      <svg id="s2-uline-wrap" width="864" height="12" viewBox="0 0 864 12">
        <path id="s2-uline" d="M0 6 Q 432 6 864 6"/>
      </svg>
    </div>
  </div>

  <!-- ── Scene 3: Palavras-chave (9–15.5s) track 3 ── -->
  <div id="s3" class="clip scene-clip"
       data-start="9" data-duration="6.5" data-track-index="3">
    <!-- Sparks -->
    <div class="spark" id="sp1" style="top:30%;left:14%"></div>
    <div class="spark" id="sp2" style="top:22%;left:72%"></div>
    <div class="spark" id="sp3" style="top:63%;left:24%"></div>
    <div class="spark" id="sp4" style="top:68%;left:81%"></div>
    <div class="spark" id="sp5" style="top:44%;left:7%"></div>
    <div class="spark" id="sp6" style="top:55%;left:91%"></div>
    <!-- Keywords (each is its own absolute layer) -->
    <div class="kw-layer" id="kw-fe">
      <span class="kw-text" id="label-fe">FÉ.</span>
    </div>
    <div class="kw-layer" id="kw-esp">
      <span class="kw-text" id="label-esp">ESPERANÇA.</span>
    </div>
    <div class="kw-layer" id="kw-red">
      <span class="kw-text" id="label-red">REDENÇÃO.</span>
    </div>
  </div>

  <!-- ── Scene 4: Citação (15–23s) track 4 ── -->
  <div id="s4" class="clip scene-clip"
       data-start="15" data-duration="8" data-track-index="4">
    <div id="s4-inner">
      <span class="s4-ln" id="s4l1">"Porque Deus amou</span>
      <span class="s4-ln" id="s4l2">o mundo de tal</span>
      <span class="s4-ln" id="s4l3">maneira…"</span>
      <div id="s4-divider"></div>
      <span id="s4-ref">João 3:16</span>
    </div>
  </div>

  <!-- ── Scene 5: Título (21.5–27s) track 5 ── -->
  <div id="s5" class="clip scene-clip"
       data-start="21.5" data-duration="5.5" data-track-index="5">
    <div id="s5-rays-bg"></div>
    <div class="ray-line" id="r1" style="height:950px;transform:translate(-50%,0) rotate(-32deg)" data-layout-allow-overflow></div>
    <div class="ray-line" id="r2" style="height:800px;transform:translate(-50%,0) rotate(-16deg)" data-layout-allow-overflow></div>
    <div class="ray-line" id="r3" style="height:1000px;transform:translate(-50%,0) rotate(0deg)" data-layout-allow-overflow></div>
    <div class="ray-line" id="r4" style="height:800px;transform:translate(-50%,0) rotate(16deg)" data-layout-allow-overflow></div>
    <div class="ray-line" id="r5" style="height:950px;transform:translate(-50%,0) rotate(32deg)" data-layout-allow-overflow></div>
    <div class="ray-line" id="r6" style="height:640px;transform:translate(-50%,0) rotate(-55deg)" data-layout-allow-overflow></div>
    <div class="ray-line" id="r7" style="height:640px;transform:translate(-50%,0) rotate(55deg)" data-layout-allow-overflow></div>
    <div id="s5-wrap">
      <span id="s5-eyebrow">A História</span>
      <span id="s5-t1">DE</span>
      <span id="s5-t2">JESUS.</span>
    </div>
  </div>

  <!-- ── Scene 6: Encerramento (27–30s) track 6 ── -->
  <div id="s6" class="clip scene-clip"
       data-start="27" data-duration="3" data-track-index="6">
    <div id="s6-wrap">
      <span id="s6-title">A História<br>de Jesus</span>
      <span id="s6-sub">Um documentário em 13 capítulos.</span>
    </div>
    <div id="s6-dot"></div>
  </div>

  <!-- ── Fade to black (28.2–30s) track 9 ── -->
  <div
    id="final-fade"
    class="clip"
    data-start="28.2"
    data-duration="1.8"
    data-track-index="9"
  ></div>

</div><!-- #root -->

<script>
(function () {
  // ── Seeded PRNG ──────────────────────────────────────────────────────
  function mulberry32(seed) {
    return function () {
      seed |= 0;
      seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rng = mulberry32(0xCAFEBABE);
  function rand(a, b) { return a + rng() * (b - a); }

  // ── Particle system (canvas, deterministic) ─────────────────────────
  var canvas = document.getElementById('particle-canvas');
  var ctx = canvas.getContext('2d');
  var W = 1080, H = 1920, FPS = 30;

  var particles = [];
  for (var i = 0; i < 120; i++) {
    particles.push({
      x: rand(0, W), y: rand(0, H),
      r: rand(0.6, 2.4),
      vx: rand(-0.12, 0.12), vy: rand(-0.20, -0.06),
      alpha: rand(0.06, 0.32),
      pulse: rand(0, Math.PI * 2),
      ps: rand(0.012, 0.038)
    });
  }

  function drawCanvas(t) {
    var frame = t * FPS;
    ctx.clearRect(0, 0, W, H);
    for (var p of particles) {
      var a = p.alpha * (0.55 + 0.45 * Math.sin(p.pulse + p.ps * frame));
      var x = ((p.x + p.vx * frame) % (W + 8) + W + 8) % (W + 8) - 4;
      var y = ((p.y + p.vy * frame) % (H + 8) + H + 8) % (H + 8) - 4;
      ctx.beginPath();
      ctx.arc(x, y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(201,162,75,' + a.toFixed(3) + ')';
      ctx.fill();
    }
  }

  // Initial canvas draw
  drawCanvas(0);

  // ── GSAP Timeline ────────────────────────────────────────────────────
  var tl = gsap.timeline({ paused: true });

  // ── S1 entrances (relative to clip start 0s) ──
  tl.from('#s1-dot',  { scale: 0, opacity: 0, transformOrigin: '50% 50%',
                        duration: 0.5, ease: 'expo.out' }, 0.15);
  tl.from('#s1-glow', { scale: 0, opacity: 0, transformOrigin: '50% 50%',
                        duration: 1.3, ease: 'power2.out' }, 0.2);
  tl.from('#s1-text', { opacity: 0, duration: 1.1, ease: 'sine.inOut' }, 0.75);

  // ── S2 entrances (clip start 4s) ──
  tl.from('#s2-sweep', { x: '-105%', duration: 1.0, ease: 'power2.inOut' }, 4.1);
  tl.from('#s2-main',  { opacity: 0, y: 70, duration: 0.9, ease: 'power3.out' }, 4.2);
  tl.to('#s2-uline',   { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, 5.2);

  // ── S3 keywords (clip start 9s) ──
  // FÉ: 9.1–11.0s
  tl.from('#label-fe', { opacity: 0, scale: 0.84, transformOrigin: '50% 50%',
                         duration: 0.22, ease: 'power3.out' }, 9.15);
  tl.to(['#sp1','#sp3'], { opacity: 1, scale: 2.8, transformOrigin: '50% 50%',
                           duration: 0.18, ease: 'power2.out' }, 9.2);
  tl.to(['#sp1','#sp3'], { opacity: 0, scale: 0.5, transformOrigin: '50% 50%',
                           duration: 0.35, ease: 'power1.in' }, 9.38);
  tl.to('#label-fe', { opacity: 0, scale: 1.1, transformOrigin: '50% 50%',
                       duration: 0.2, ease: 'power2.in' }, 10.9);

  // ESPERANÇA: 11.0–13.0s
  tl.from('#label-esp', { opacity: 0, scale: 0.84, transformOrigin: '50% 50%',
                          duration: 0.22, ease: 'power3.out' }, 11.05);
  tl.to(['#sp2','#sp5'], { opacity: 1, scale: 2.8, transformOrigin: '50% 50%',
                           duration: 0.18, ease: 'power2.out' }, 11.1);
  tl.to(['#sp2','#sp5'], { opacity: 0, scale: 0.5, transformOrigin: '50% 50%',
                           duration: 0.35, ease: 'power1.in' }, 11.28);
  tl.to('#label-esp', { opacity: 0, scale: 1.1, transformOrigin: '50% 50%',
                        duration: 0.2, ease: 'power2.in' }, 13.0);

  // REDENÇÃO: 13.05–15.5s
  tl.from('#label-red', { opacity: 0, scale: 0.84, transformOrigin: '50% 50%',
                          duration: 0.22, ease: 'power3.out' }, 13.1);
  tl.to(['#sp4','#sp6'], { opacity: 1, scale: 2.8, transformOrigin: '50% 50%',
                           duration: 0.18, ease: 'power2.out' }, 13.15);
  tl.to(['#sp4','#sp6'], { opacity: 0, scale: 0.5, transformOrigin: '50% 50%',
                           duration: 0.35, ease: 'power1.in' }, 13.33);

  // ── S4 citation (clip start 15s) ──
  tl.from('#s4l1', { opacity: 0, y: 36, duration: 0.7, ease: 'power2.out' }, 15.3);
  tl.from('#s4l2', { opacity: 0, y: 36, duration: 0.7, ease: 'power2.out' }, 15.95);
  tl.from('#s4l3', { opacity: 0, y: 36, duration: 0.7, ease: 'power2.out' }, 16.6);
  tl.from('#s4-divider', { scaleY: 0, transformOrigin: 'top center',
                           duration: 0.6, ease: 'power2.inOut' }, 17.5);
  tl.from('#s4-ref', { opacity: 0, duration: 0.75, ease: 'sine.inOut' }, 18.0);

  // ── S5 title reveal (clip start 21.5s) ──
  tl.from('#s5-rays-bg', { opacity: 0, scale: 0.5, transformOrigin: '50% 50%',
                           duration: 1.1, ease: 'power2.out' }, 21.6);
  tl.from(['#r1','#r2','#r3','#r4','#r5','#r6','#r7'], {
    opacity: 0, stagger: 0.055, duration: 0.75, ease: 'sine.in'
  }, 21.65);
  tl.from('#s5-eyebrow', { opacity: 0, y: 28, duration: 0.65, ease: 'power2.out' }, 22.2);
  tl.from('#s5-t1', { opacity: 0, scale: 0.88, transformOrigin: '50% 50%',
                      duration: 0.8,  ease: 'expo.out' }, 22.75);
  tl.from('#s5-t2', { opacity: 0, scale: 0.88, transformOrigin: '50% 50%',
                      duration: 0.9,  ease: 'expo.out' }, 23.25);

  // ── S6 outro (clip start 27s) ──
  tl.from('#s6-title', { opacity: 0, duration: 0.65, ease: 'sine.inOut' }, 27.2);
  tl.from('#s6-sub',   { opacity: 0, duration: 0.7,  ease: 'sine.inOut' }, 27.85);
  tl.from('#s6-dot',   { opacity: 0, duration: 0.5,  ease: 'sine.inOut' }, 28.2);

  // ── Final fade (clip start 28.2s) ──
  tl.from('#final-fade', { opacity: 0, duration: 1.7, ease: 'sine.inOut' }, 28.2);

  // ── Register timeline ────────────────────────────────────────────────
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;

  // ── Also expose __hf with canvas sync ───────────────────────────────
  window.__hf = {
    duration: 30,
    seek: function (t) {
      tl.seek(t, true);
      drawCanvas(t);
    }
  };

})();
</script>
</body>
</html>
