<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>A História de Jesus — Teaser</title>
</head>
<body>

<div data-composition-id="jesus-teaser"
     data-start="0"
     data-width="1080"
     data-height="1920">

  <!-- ═══════════════════════════════════════════
       GLOBAL STYLES
  ════════════════════════════════════════════ -->
  <style>
    /* Scoped to root composition */
    #jesus-teaser {
      font-family: serif;
      background: #0A0A0A;
      overflow: hidden;
    }

    /* ── Particle canvas (persistent bg) ── */
    #particle-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ── All timed clips ── */
    #jesus-teaser .clip {
      /* visibility toggled by HyperFrames runtime */
    }

    /* ── Scene base ── */
    #jesus-teaser .scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    /* Safe-area content wrapper */
    #jesus-teaser .scene-content {
      width: 100%;
      height: 100%;
      padding: 192px 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      box-sizing: border-box;
    }

    /* ── Scene 1: Abertura ── */
    #jesus-teaser #s1 { z-index: 2; }
    #jesus-teaser .s1-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(201,162,75,0.25) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
    }
    #jesus-teaser .s1-dot {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #C9A24B;
      box-shadow: 0 0 24px 8px rgba(201,162,75,0.8), 0 0 80px 30px rgba(201,162,75,0.3);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
    }
    #jesus-teaser .s1-text {
      position: relative;
      z-index: 3;
      text-align: center;
      color: #F5F0E8;
      font-size: 46px;
      letter-spacing: 2px;
      line-height: 1.65;
      text-shadow: 0 0 20px rgba(201,162,75,0.35);
      opacity: 0;
      margin-top: 40px;
    }

    /* ── Scene 2: Revelação ── */
    #jesus-teaser #s2 { z-index: 3; background: transparent; }
    #jesus-teaser .s2-sweep {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(201,162,75,0.12) 50%, transparent 100%);
      transform: translateX(-100%);
    }
    #jesus-teaser .s2-text-block {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 0 80px;
    }
    #jesus-teaser .s2-main {
      color: #F5F0E8;
      font-size: 58px;
      line-height: 1.5;
      letter-spacing: 1px;
      opacity: 0;
      transform: translateY(60px);
    }
    #jesus-teaser .s2-underline-svg {
      display: block;
      width: 100%;
      height: 8px;
      margin-top: 18px;
      overflow: visible;
    }
    #jesus-teaser .s2-underline-path {
      stroke: #C9A24B;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-dasharray: 864;
      stroke-dashoffset: 864;
    }

    /* ── Scene 3: Palavras-chave ── */
    #jesus-teaser #s3 { z-index: 4; }
    #jesus-teaser .s3-word {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #jesus-teaser .s3-label {
      color: #F5F0E8;
      font-size: 120px;
      letter-spacing: 14px;
      text-shadow:
        0 0 40px rgba(201,162,75,0.5),
        0 0 80px rgba(201,162,75,0.2);
      opacity: 0;
      transform: scale(0.88);
    }
    #jesus-teaser .s3-spark {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #C9A24B;
      box-shadow: 0 0 8px 3px rgba(201,162,75,0.7);
      opacity: 0;
    }

    /* ── Scene 4: Citação ── */
    #jesus-teaser #s4 { z-index: 5; }
    #jesus-teaser .s4-content {
      width: 100%;
      height: 100%;
      padding: 192px 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      box-sizing: border-box;
    }
    #jesus-teaser .s4-line1,
    #jesus-teaser .s4-line2,
    #jesus-teaser .s4-line3 {
      color: #F5F0E8;
      font-size: 52px;
      font-style: italic;
      line-height: 1.65;
      letter-spacing: 0.5px;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
    }
    #jesus-teaser .s4-divider {
      width: 2px;
      height: 0px;
      background: rgba(201,162,75,0.5);
      margin: 28px auto;
    }
    #jesus-teaser .s4-ref {
      color: #C9A24B;
      font-size: 32px;
      letter-spacing: 5px;
      text-transform: uppercase;
      font-style: normal;
      opacity: 0;
    }

    /* ── Scene 5: Título ── */
    #jesus-teaser #s5 { z-index: 6; }
    #jesus-teaser .s5-rays {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 50% at 50% 50%,
        rgba(201,162,75,0.3) 0%,
        rgba(201,162,75,0.08) 35%,
        transparent 65%);
      transform: scale(0.6);
      opacity: 0;
    }
    #jesus-teaser .s5-ray-line {
      position: absolute;
      top: 50%; left: 50%;
      width: 1px;
      background: linear-gradient(to bottom, rgba(201,162,75,0.6), transparent);
      transform-origin: top center;
      opacity: 0;
    }
    #jesus-teaser .s5-title-wrap {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 0 80px;
    }
    #jesus-teaser .s5-eyebrow {
      display: block;
      color: rgba(201,162,75,0.75);
      font-size: 44px;
      letter-spacing: 10px;
      text-transform: uppercase;
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(20px);
    }
    #jesus-teaser .s5-title-line1,
    #jesus-teaser .s5-title-line2 {
      display: block;
      color: #C9A24B;
      font-size: 164px;
      letter-spacing: 6px;
      text-transform: uppercase;
      line-height: 0.95;
      text-shadow:
        0 0 30px rgba(201,162,75,0.7),
        0 0 80px rgba(201,162,75,0.25),
        0 4px 8px rgba(0,0,0,0.9);
      opacity: 0;
      transform: scale(0.9);
    }

    /* ── Scene 6: Encerramento ── */
    #jesus-teaser #s6 { z-index: 7; }
    #jesus-teaser .s6-title-sm {
      display: block;
      color: #C9A24B;
      font-size: 90px;
      letter-spacing: 4px;
      text-transform: uppercase;
      line-height: 1.1;
      text-align: center;
      text-shadow: 0 0 20px rgba(201,162,75,0.4);
      opacity: 0;
    }
    #jesus-teaser .s6-sub {
      display: block;
      color: #a08a5a;
      font-size: 30px;
      letter-spacing: 3px;
      text-align: center;
      margin-top: 22px;
      opacity: 0;
    }
    #jesus-teaser .s6-final-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #C9A24B;
      box-shadow: 0 0 16px 6px rgba(201,162,75,0.6);
      bottom: 22%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
    }

    /* Fade overlay */
    #jesus-teaser .scene-fade {
      position: absolute;
      inset: 0;
      background: #0A0A0A;
      z-index: 50;
      opacity: 0;
      pointer-events: none;
    }
  </style>

  <!-- ═══════════════════════════════════════════
       PARTICLE CANVAS (always on)
  ════════════════════════════════════════════ -->
  <canvas id="particle-canvas"
    class="clip"
    data-start="0" data-duration="30" data-track-index="0">
  </canvas>

  <!-- ═══════════════════════════════════════════
       SCENE 1 · 0–4.5s · Abertura
  ════════════════════════════════════════════ -->
  <div id="s1" class="clip scene"
    data-start="0" data-duration="4.5" data-track-index="1">
    <div class="s1-glow" id="s1-glow"></div>
    <div class="s1-dot" id="s1-dot"></div>
    <div class="s1-text" id="s1-text">Há mais de dois mil anos…</div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCENE 2 · 3.5–9.5s · Revelação
  ════════════════════════════════════════════ -->
  <div id="s2" class="clip scene"
    data-start="3.5" data-duration="6" data-track-index="2">
    <div class="s2-sweep" id="s2-sweep"></div>
    <div class="s2-text-block">
      <p class="s2-main" id="s2-main">uma história mudou<br>o mundo para sempre.</p>
      <svg class="s2-underline-svg" viewBox="0 0 864 8" preserveAspectRatio="none">
        <path class="s2-underline-path" id="s2-uline" d="M0 4 Q 432 4 864 4"/>
      </svg>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCENE 3 · 8.8–15.2s · Palavras-chave
  ════════════════════════════════════════════ -->
  <div id="s3" class="clip scene"
    data-start="8.8" data-duration="6.4" data-track-index="3">

    <div class="s3-spark" id="sp1" style="top:30%;left:15%"></div>
    <div class="s3-spark" id="sp2" style="top:20%;left:70%"></div>
    <div class="s3-spark" id="sp3" style="top:60%;left:25%"></div>
    <div class="s3-spark" id="sp4" style="top:70%;left:80%"></div>
    <div class="s3-spark" id="sp5" style="top:45%;left:8%"></div>
    <div class="s3-spark" id="sp6" style="top:55%;left:90%"></div>

    <div class="s3-word" id="kw-fe">
      <span class="s3-label" id="label-fe">FÉ.</span>
    </div>
    <div class="s3-word" id="kw-esperanca">
      <span class="s3-label" id="label-esp">ESPERANÇA.</span>
    </div>
    <div class="s3-word" id="kw-redencao">
      <span class="s3-label" id="label-red">REDENÇÃO.</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCENE 4 · 14.5–22.5s · Citação
  ════════════════════════════════════════════ -->
  <div id="s4" class="clip scene"
    data-start="14.5" data-duration="8" data-track-index="4">
    <div class="s4-content">
      <span class="s4-line1" id="s4l1">"Porque Deus amou</span>
      <span class="s4-line2" id="s4l2">o mundo de tal</span>
      <span class="s4-line3" id="s4l3">maneira…"</span>
      <div class="s4-divider" id="s4-div"></div>
      <span class="s4-ref" id="s4-ref">João 3:16</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCENE 5 · 21–27.5s · Título
  ════════════════════════════════════════════ -->
  <div id="s5" class="clip scene"
    data-start="21" data-duration="6.5" data-track-index="5">
    <div class="s5-rays" id="s5-rays"></div>
    <div class="s5-ray-line" id="r1" style="height:900px;transform:translate(-50%,0) rotate(-30deg)"></div>
    <div class="s5-ray-line" id="r2" style="height:760px;transform:translate(-50%,0) rotate(-15deg)"></div>
    <div class="s5-ray-line" id="r3" style="height:1100px;transform:translate(-50%,0) rotate(0deg)"></div>
    <div class="s5-ray-line" id="r4" style="height:760px;transform:translate(-50%,0) rotate(15deg)"></div>
    <div class="s5-ray-line" id="r5" style="height:900px;transform:translate(-50%,0) rotate(30deg)"></div>
    <div class="s5-ray-line" id="r6" style="height:600px;transform:translate(-50%,0) rotate(-50deg)"></div>
    <div class="s5-ray-line" id="r7" style="height:600px;transform:translate(-50%,0) rotate(50deg)"></div>

    <div class="s5-title-wrap">
      <span class="s5-eyebrow" id="s5-eye">A História</span>
      <span class="s5-title-line1" id="s5-t1">DE</span>
      <span class="s5-title-line2" id="s5-t2">JESUS.</span>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       SCENE 6 · 26.5–30s · Encerramento
  ════════════════════════════════════════════ -->
  <div id="s6" class="clip scene"
    data-start="26.5" data-duration="3.5" data-track-index="6">
    <div class="scene-content">
      <span class="s6-title-sm" id="s6-title">A História<br>de Jesus</span>
      <span class="s6-sub" id="s6-sub">Um documentário em 13 capítulos.</span>
    </div>
    <div class="s6-final-dot" id="s6-dot"></div>
  </div>

  <!-- Fade to black overlay -->
  <div class="clip scene-fade" id="final-fade"
    data-start="28.5" data-duration="1.5" data-track-index="9">
  </div>

  <!-- ═══════════════════════════════════════════
       SCRIPTS
  ════════════════════════════════════════════ -->
  <script src="vendor/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};

    // ─── Seeded PRNG (mulberry32 — deterministic for rendering) ────────
    function mulberry32(seed) {
      return function() {
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // ─── Particle canvas (GSAP-driven, deterministic) ─────────────────
    (function() {
      const canvas = document.getElementById('particle-canvas');
      const W = 1080, H = 1920;
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const rng = mulberry32(0xDEADBEEF);
      function rand(min, max) { return min + rng() * (max - min); }

      const GOLD = [201, 162, 75];
      const particles = [];

      for (let i = 0; i < 120; i++) {
        particles.push({
          x: rand(0, W),
          y: rand(0, H),
          r: rand(0.5, 2.2),
          vx: rand(-0.12, 0.12),
          vy: rand(-0.18, -0.06),
          alpha: rand(0.08, 0.35),
          pulse: rand(0, Math.PI * 2),
          pulseSpeed: rand(0.015, 0.04)
        });
      }

      // GSAP proxy drives the "frame" counter deterministically
      const proxy = { t: 0 };
      gsap.to(proxy, {
        t: 1800, // 30s × 60fps
        duration: 30,
        ease: 'none',
        paused: true,
        onUpdate() {
          const frame = Math.round(proxy.t);
          ctx.clearRect(0, 0, W, H);

          for (const p of particles) {
            const pulse = p.pulse + p.pulseSpeed * frame;
            const a = p.alpha * (0.6 + 0.4 * Math.sin(pulse));
            const x = ((p.x + p.vx * frame) % (W + 8) + (W + 8)) % (W + 8) - 4;
            const y = ((p.y + p.vy * frame) % (H + 8) + (H + 8)) % (H + 8) - 4;
            ctx.beginPath();
            ctx.arc(x, y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${GOLD[0]},${GOLD[1]},${GOLD[2]},${a.toFixed(3)})`;
            ctx.fill();
          }
        }
      });

      // Expose so master timeline can include/sync it
      window.__particleProxy = proxy;
    })();

    // ─── Master GSAP timeline ──────────────────────────────────────────
    const tl = gsap.timeline({ paused: true });

    // Sync particle canvas with master timeline
    tl.add(gsap.to(window.__particleProxy, {
      t: 1800,
      duration: 30,
      ease: 'none'
    }), 0);

    // ── SCENE 1: 0–4.5s ───────────────────────────────────────────────
    tl.to('#s1-dot',  { scale: 1, opacity: 1, duration: 0.5, ease: 'expo.out' }, 0.15);
    tl.to('#s1-glow', { scale: 1, opacity: 1, duration: 1.2, ease: 'power2.out' }, 0.2);
    tl.to('#s1-text', { opacity: 1, duration: 1.0, ease: 'sine.inOut' }, 0.7);

    // ── SCENE 2: 3.5–9.5s ─────────────────────────────────────────────
    tl.to('#s2-sweep', { x: '200%', duration: 0.9, ease: 'power2.inOut' }, 3.6);
    tl.to('#s2-main',  { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out' }, 3.8);
    tl.to('#s2-uline', { strokeDashoffset: 0, duration: 1.1, ease: 'power2.inOut' }, 4.9);

    // ── SCENE 3: 8.8–15.2s ────────────────────────────────────────────
    // FÉ.
    tl.to('#label-fe',       { opacity: 1, scale: 1, duration: 0.25, ease: 'power3.out' }, 9.0);
    tl.to(['#sp1','#sp3'],   { opacity: 0.8, scale: 3, duration: 0.2,  ease: 'power2.out' }, 9.05);
    tl.to(['#sp1','#sp3'],   { opacity: 0,   scale: 1, duration: 0.4,  ease: 'power1.in'  }, 9.25);
    tl.to('#label-fe',       { opacity: 0, scale: 1.08, duration: 0.22, ease: 'power2.in' }, 10.78);

    // ESPERANÇA.
    tl.to('#label-esp',      { opacity: 1, scale: 1, duration: 0.25, ease: 'power3.out' }, 10.85);
    tl.to(['#sp2','#sp5'],   { opacity: 0.8, scale: 3, duration: 0.2,  ease: 'power2.out' }, 10.9);
    tl.to(['#sp2','#sp5'],   { opacity: 0,   scale: 1, duration: 0.4,  ease: 'power1.in'  }, 11.1);
    tl.to('#label-esp',      { opacity: 0, scale: 1.08, duration: 0.22, ease: 'power2.in' }, 12.78);

    // REDENÇÃO.
    tl.to('#label-red',      { opacity: 1, scale: 1, duration: 0.25, ease: 'power3.out' }, 12.85);
    tl.to(['#sp4','#sp6'],   { opacity: 0.8, scale: 3, duration: 0.2,  ease: 'power2.out' }, 12.9);
    tl.to(['#sp4','#sp6'],   { opacity: 0,   scale: 1, duration: 0.4,  ease: 'power1.in'  }, 13.1);

    // ── SCENE 4: 14.5–22.5s ───────────────────────────────────────────
    tl.to('#s4l1',   { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 15.0);
    tl.to('#s4l2',   { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 15.6);
    tl.to('#s4l3',   { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 16.2);
    tl.to('#s4-div', { height: 50, duration: 0.6, ease: 'power2.inOut' }, 17.1);
    tl.to('#s4-ref', { opacity: 1, duration: 0.7, ease: 'sine.inOut' }, 17.6);

    // ── SCENE 5: 21–27.5s ─────────────────────────────────────────────
    tl.to(['#r1','#r2','#r3','#r4','#r5','#r6','#r7'], {
      opacity: 0.35, stagger: 0.06, duration: 0.7, ease: 'sine.in'
    }, 21.2);
    tl.to('#s5-rays', { opacity: 1, scale: 1, duration: 1.0, ease: 'power2.out' }, 21.2);
    tl.to('#s5-eye',  { opacity: 1, y: 0, duration: 0.6, ease: 'power2.out' }, 21.8);
    tl.to('#s5-t1',   { opacity: 1, scale: 1, duration: 0.75, ease: 'expo.out' }, 22.3);
    tl.to('#s5-t2',   { opacity: 1, scale: 1, duration: 0.85, ease: 'expo.out' }, 22.75);
    tl.to(['#r1','#r2','#r3','#r4','#r5','#r6','#r7'], {
      opacity: 0.18, duration: 1.8, ease: 'sine.inOut', yoyo: true, repeat: 1
    }, 23.6);

    // ── SCENE 6: 26.5–30s ─────────────────────────────────────────────
    tl.to('#s6-title', { opacity: 1, duration: 0.6, ease: 'sine.inOut' }, 27.0);
    tl.to('#s6-sub',   { opacity: 1, duration: 0.7, ease: 'sine.inOut' }, 27.6);
    tl.to('#s6-dot',   { opacity: 1, duration: 0.5, ease: 'sine.inOut' }, 28.0);

    // ── FINAL FADE: 28.5–30s ──────────────────────────────────────────
    tl.to('#final-fade', { opacity: 1, duration: 1.3, ease: 'sine.inOut' }, 28.5);
    tl.to('#s6-dot',     { opacity: 0, duration: 0.8, ease: 'sine.in'   }, 28.7);

    window.__timelines['jesus-teaser'] = tl;
  </script>

</div>
</body>
</html>
