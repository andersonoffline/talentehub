<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartHub — Perfil da Empresa</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#06090F;--surface:#0D1117;--surface2:#131920;--accent:#00E87B;--blue:#4F7CFF;--coral:#FF6B6B;--amber:#FFB800;--t:#F0F4FF;--t2:#8892A4;--t3:#4A5568;--border:rgba(255,255,255,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(6,9,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.nav-logo{font-family:'Outfit',sans-serif;font-weight:800;font-size:22px;color:var(--t);text-decoration:none}.nav-logo span{color:var(--accent)}
.nav-back{color:var(--t2);text-decoration:none;font-size:14px;font-weight:600}.nav-back:hover{color:var(--t)}
.page{padding:88px 40px 80px;max-width:1060px;margin:0 auto;display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:start}

/* CAPA */
.capa{background:linear-gradient(135deg,#0D1117,#141B2D);border:1px solid var(--border);border-radius:20px;overflow:hidden;margin-bottom:20px;position:relative}
.capa-bg{height:120px;background:linear-gradient(135deg,rgba(79,124,255,.15),rgba(0,232,123,.08));position:relative}
.empresa-logo-wrap{position:absolute;bottom:-28px;left:28px}
.empresa-logo{width:72px;height:72px;border-radius:16px;border:3px solid var(--bg);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif;font-weight:800;font-size:26px;overflow:hidden}
.empresa-logo img{width:100%;height:100%;object-fit:cover;border-radius:13px}
.capa-info{padding:44px 28px 24px}
.empresa-nome{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.empresa-setor{font-size:14px;color:var(--accent);font-weight:600;margin-bottom:12px}
.empresa-meta{display:flex;flex-wrap:wrap;gap:16px}
.meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2)}
.capa-actions{display:flex;gap:10px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.btn{padding:10px 24px;border-radius:10px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;cursor:pointer;border:none;transition:all .2s;text-decoration:none;display:inline-block}
.btn-primary{background:var(--accent);color:#030A0E}.btn-primary:hover{background:#00ff88}
.btn-secondary{background:var(--surface2);color:var(--t);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--t3)}

/* SEÇÕES */
.section{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
.section-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section p{font-size:14px;color:var(--t2);line-height:1.7}

/* VAGAS */
.vagas-lista{display:flex;flex-direction:column;gap:10px}
.vaga-mini{padding:14px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);text-decoration:none;color:inherit;display:block;transition:all .2s}
.vaga-mini:hover{border-color:rgba(79,124,255,.3);transform:translateY(-1px)}
.vaga-mini-titulo{font-size:14px;font-weight:700;margin-bottom:4px}
.vaga-mini-meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid}
.tag-tipo{background:rgba(79,124,255,.1);color:var(--blue);border-color:rgba(79,124,255,.2)}
.tag-modelo{background:rgba(0,232,123,.08);color:var(--accent);border-color:rgba(0,232,123,.15)}
.tag-nivel{background:rgba(255,184,0,.08);color:var(--amber);border-color:rgba(255,184,0,.15)}
.vaga-mini-sal{font-size:13px;font-weight:700;color:var(--accent);margin-top:8px}

/* SIDEBAR */
.sidebar-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.sidebar-title{font-family:'Outfit',sans-serif;font-size:13px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--t2)}
.info-value{color:var(--t);font-weight:600;text-align:right}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-box{background:var(--surface2);border-radius:10px;padding:14px;text-align:center}
.stat-value{font-family:'Outfit',sans-serif;font-size:22px;font-weight:800;color:var(--accent)}
.stat-label{font-size:11px;color:var(--t3);margin-top:2px}

/* SKELETON */
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface) 50%,var(--surface2) 75%);background-size:200%;animation:shimmer 1.5s infinite;border-radius:8px}
@keyframes shimmer{to{background-position:-200% 0}}

@media(max-width:900px){
  .page{grid-template-columns:1fr}
  nav{padding:0 16px}
  .page{padding:80px 16px 60px}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo">Smart<span>Hub</span></a>
  <a href="vagas-listagem.html" class="nav-back">← Vagas</a>
</nav>

<div class="page">
  <!-- COLUNA PRINCIPAL -->
  <div>
    <!-- CAPA -->
    <div class="capa" id="capa-section">
      <div class="capa-bg" id="capa-bg"></div>
      <div class="empresa-logo-wrap">
        <div class="empresa-logo" id="empresa-logo">?</div>
      </div>
      <div class="capa-info">
        <div class="empresa-nome" id="empresa-nome"><div class="skel" style="height:28px;width:40%"></div></div>
        <div class="empresa-setor" id="empresa-setor"></div>
        <div class="empresa-meta" id="empresa-meta"></div>
        <div class="capa-actions" id="capa-actions" style="display:none">
          <a href="#vagas-section" class="btn btn-primary">Ver vagas abertas</a>
          <a href="mensagens.html" class="btn btn-secondary">💬 Enviar mensagem</a>
        </div>
      </div>
    </div>

    <!-- SOBRE -->
    <div class="section">
      <div class="section-title">🏢 Sobre a empresa</div>
      <p id="empresa-sobre">Carregando informações...</p>
    </div>

    <!-- VAGAS ABERTAS -->
    <div class="section" id="vagas-section">
      <div class="section-title">💼 Vagas abertas <span id="vagas-count" style="color:var(--t3);font-size:13px;font-weight:400"></span></div>
      <div class="vagas-lista" id="vagas-lista">
        <div class="skel" style="height:80px;border-radius:10px"></div>
        <div class="skel" style="height:80px;border-radius:10px"></div>
      </div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div>
    <div class="sidebar-card">
      <div class="sidebar-title">Informações</div>
      <div id="info-rows">
        <div class="skel" style="height:36px;margin-bottom:8px"></div>
        <div class="skel" style="height:36px;margin-bottom:8px"></div>
        <div class="skel" style="height:36px"></div>
      </div>
    </div>
    <div class="sidebar-card">
      <div class="sidebar-title">Em números</div>
      <div class="stat-grid" id="stat-grid">
        <div class="skel" style="height:70px;border-radius:10px"></div>
        <div class="skel" style="height:70px;border-radius:10px"></div>
      </div>
    </div>
    <div class="sidebar-card" id="edit-card" style="display:none">
      <div class="sidebar-title">Gerenciar</div>
      <a href="gestor-dashboard.html" class="btn btn-secondary" style="width:100%;text-align:center;display:block;margin-bottom:8px">📊 Dashboard</a>
      <a href="nova-vaga.html" class="btn btn-primary" style="width:100%;text-align:center;display:block">+ Publicar vaga</a>
    </div>
  </div>
</div>

<script>
const sb = supabase.createClient('https://xroobxmpmeelklegchhs.supabase.co','sb_publishable_h7ZPYqJFplDqYW9lJ-LURg_kDj5-Zqo');
const params = new URLSearchParams(location.search);
const empresaId = params.get('id');

(async()=>{
  if(!empresaId){ location.href='vagas-listagem.html'; return; }

  const {data:{session}} = await sb.auth.getSession();

  // Carregar empresa
  const {data:emp,error} = await sb.from('empresas').select('*').eq('id',empresaId).single();
  if(error||!emp){ document.body.innerHTML='<div style="text-align:center;padding:120px 20px;color:var(--t3)">Empresa não encontrada.</div>'; return; }

  renderEmpresa(emp);

  // Verificar se é o dono
  if(session?.user?.id === emp.user_id){
    document.getElementById('edit-card').style.display='block';
  }

  // Carregar vagas
  await carregarVagas(emp.id);
})();

function renderEmpresa(emp){
  const ini = (emp.nome_fantasia||'?').charAt(0).toUpperCase();
  const logo = document.getElementById('empresa-logo');
  if(emp.logo_url){ logo.innerHTML=`<img src="${emp.logo_url}" alt="${emp.nome_fantasia}">`; }
  else { logo.textContent=ini; }

  document.getElementById('empresa-nome').textContent = emp.nome_fantasia || emp.razao_social || 'Empresa';
  document.getElementById('empresa-setor').textContent = emp.segmento || emp.setor || '';
  document.title = `SmartHub — ${emp.nome_fantasia || 'Empresa'}`;

  const meta = [];
  if(emp.cidade) meta.push(`📍 ${emp.cidade}${emp.estado?', '+emp.estado:''}`);
  if(emp.num_funcionarios) meta.push(`👥 ${emp.num_funcionarios} funcionários`);
  if(emp.site_url) meta.push(`🌐 <a href="${emp.site_url}" target="_blank" style="color:var(--blue);text-decoration:none">${emp.site_url.replace(/https?:\/\//,'')}</a>`);
  document.getElementById('empresa-meta').innerHTML = meta.map(m=>`<span class="meta-item">${m}</span>`).join('');

  document.getElementById('empresa-sobre').textContent = emp.descricao || 'Informações sobre a empresa ainda não disponíveis.';

  document.getElementById('capa-actions').style.display='flex';

  // Info rows
  const infos = [
    {label:'Setor', value: emp.segmento||emp.setor||'—'},
    {label:'Porte', value: emp.num_funcionarios||'—'},
    {label:'Cidade', value: emp.cidade ? `${emp.cidade}${emp.estado?', '+emp.estado:''}` : '—'},
    {label:'Fundada em', value: emp.ano_fundacao||'—'},
  ].filter(i=>i.value!=='—');

  document.getElementById('info-rows').innerHTML = infos.map(i=>`
    <div class="info-row">
      <span class="info-label">${i.label}</span>
      <span class="info-value">${i.value}</span>
    </div>`).join('') || '<p style="font-size:13px;color:var(--t3)">Sem informações cadastradas.</p>';
}

async function carregarVagas(empId){
  const {data:vagas, count} = await sb.from('vagas')
    .select('*', {count:'exact'})
    .eq('empresa_id', empId)
    .eq('status','ativa')
    .order('created_at',{ascending:false});

  document.getElementById('vagas-count').textContent = `(${count||0})`;

  // Stats
  const {count:totalCands} = await sb.from('candidaturas')
    .select('id',{count:'exact',head:true})
    .in('vaga_id', (vagas||[]).map(v=>v.id));

  document.getElementById('stat-grid').innerHTML = `
    <div class="stat-box"><div class="stat-value">${count||0}</div><div class="stat-label">Vagas ativas</div></div>
    <div class="stat-box"><div class="stat-value">${totalCands||0}</div><div class="stat-label">Candidaturas</div></div>`;

  const lista = document.getElementById('vagas-lista');
  if(!vagas||vagas.length===0){
    lista.innerHTML='<p style="font-size:14px;color:var(--t3);text-align:center;padding:20px">Nenhuma vaga aberta no momento.</p>';
    return;
  }

  lista.innerHTML = vagas.map(v=>{
    const sal = v.salario_min&&v.salario_max
      ? `R$ ${v.salario_min.toLocaleString('pt-BR')} – ${v.salario_max.toLocaleString('pt-BR')}`
      : v.salario_min ? `R$ ${v.salario_min.toLocaleString('pt-BR')}+` : 'A combinar';
    return `
    <a class="vaga-mini" href="vaga-detalhe.html?id=${v.id}">
      <div class="vaga-mini-titulo">${v.titulo}</div>
      <div class="vaga-mini-meta">
        ${v.tipo_contrato?`<span class="tag tag-tipo">${v.tipo_contrato.toUpperCase()}</span>`:''}
        ${v.modalidade?`<span class="tag tag-modelo">${v.modalidade.charAt(0).toUpperCase()+v.modalidade.slice(1)}</span>`:''}
        ${v.nivel?`<span class="tag tag-nivel">${v.nivel.charAt(0).toUpperCase()+v.nivel.slice(1)}</span>`:''}
      </div>
      <div class="vaga-mini-sal">${sal}</div>
    </a>`;
  }).join('');
}
</script>
</body>
</html>
